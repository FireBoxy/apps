<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lex - Live HTML Code Runner</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/FireBoxy/assets@main/Lex-logo.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CodeMirror 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

    <style>
        :root {
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --accent-border: rgba(59, 130, 246, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
        }

        .accent-bg { background-color: var(--accent-color) !important; }
        .accent-text { color: var(--accent-color) !important; }
        .accent-border { border-color: var(--accent-border) !important; }
        .accent-glow { box-shadow: 0 0 20px var(--accent-glow); }

        .CodeMirror {
            height: 100% !important;
            font-family: 'Fira Code', Monaco, Consolas, monospace;
            font-size: 13.5px;
            background-color: #0d1322 !important;
        }

        .cm-s-dracula.CodeMirror {
            background-color: #0d1322 !important;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1322;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

    <!-- Onboarding Modal -->
    <div id="onboardingModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-6 text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-slate-800/80 p-2.5 accent-glow mb-1">
                <img src="https://cdn.jsdelivr.net/gh/FireBoxy/assets@main/Lex-logo.png" alt="Lex Logo" class="w-full h-full object-contain">
            </div>
            
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Welcome to Lex</h1>
                <p class="text-xs text-slate-400 mt-1.5">Minimalist HTML, CSS & JavaScript Runner</p>
            </div>

            <div class="space-y-3">
                <label class="text-xs font-semibold tracking-wider uppercase text-slate-400">Choose your Accent Color</label>
                <div class="grid grid-cols-7 gap-2.5 justify-items-center pt-1" id="colorPickerGrid">
                    <!-- Accent color options -->
                    <button onclick="selectAccent('#3b82f6')" class="color-opt w-8 h-8 rounded-full bg-blue-500 border-2 border-transparent transition-all scale-100 hover:scale-110" data-color="#3b82f6"></button>
                    <button onclick="selectAccent('#10b981')" class="color-opt w-8 h-8 rounded-full bg-emerald-500 border-2 border-transparent transition-all scale-100 hover:scale-110" data-color="#10b981"></button>
                    <button onclick="selectAccent('#8b5cf6')" class="color-opt w-8 h-8 rounded-full bg-purple-500 border-2 border-transparent transition-all scale-100 hover:scale-110" data-color="#8b5cf6"></button>
                    <button onclick="selectAccent('#f59e0b')" class="color-opt w-8 h-8 rounded-full bg-amber-500 border-2 border-transparent transition-all scale-100 hover:scale-110" data-color="#f59e0b"></button>
                    <button onclick="selectAccent('#ef4444')" class="color-opt w-8 h-8 rounded-full bg-red-500 border-2 border-transparent transition-all scale-100 hover:scale-110" data-color="#ef4444"></button>
                    <button onclick="selectAccent('#ec4899')" class="color-opt w-8 h-8 rounded-full bg-pink-500 border-2 border-transparent transition-all scale-100 hover:scale-110" data-color="#ec4899"></button>
                    <button onclick="selectAccent('#06b6d4')" class="color-opt w-8 h-8 rounded-full bg-cyan-500 border-2 border-transparent transition-all scale-100 hover:scale-110" data-color="#06b6d4"></button>
                </div>
            </div>

            <button onclick="completeOnboarding()" class="w-full accent-bg text-white font-medium py-2.5 rounded-xl transition shadow-lg accent-glow text-sm">
                Get Started
            </button>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Code Editor Panel -->
        <div class="w-full md:w-1/2 flex flex-col h-1/2 md:h-full border-b md:border-b-0 md:border-r border-slate-800">
            <!-- File Tabs -->
            <div class="flex items-center bg-slate-900 border-b border-slate-800 px-2 py-1 space-x-1">
                <button onclick="switchTab('html')" id="tabHtml" class="px-3 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition">HTML</button>
                <button onclick="switchTab('css')" id="tabCss" class="px-3 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition">CSS</button>
                <button onclick="switchTab('js')" id="tabJs" class="px-3 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition">JS</button>
            </div>

            <!-- Code Editors Container -->
            <div class="flex-1 relative">
                <div id="editorHtmlWrap" class="absolute inset-0"><textarea id="editorHtml"></textarea></div>
                <div id="editorCssWrap" class="absolute inset-0 hidden"><textarea id="editorCss"></textarea></div>
                <div id="editorJsWrap" class="absolute inset-0 hidden"><textarea id="editorJs"></textarea></div>
            </div>
        </div>

        <!-- Output & Console Panel -->
        <div class="w-full md:w-1/2 flex flex-col h-1/2 md:h-full bg-slate-950 relative">
            <!-- Preview Top Bar -->
            <div class="bg-slate-900 border-b border-slate-800 px-3 py-1.5 flex items-center justify-between text-xs text-slate-400">
                <div class="flex items-center space-x-3">
                    <span class="font-mono text-[11px] text-slate-500">localhost:3000</span>
                    <button onclick="runCode()" class="accent-bg hover:opacity-90 text-white px-3 py-1 rounded-lg text-xs font-semibold tracking-wide transition flex items-center space-x-1.5 shadow-sm accent-glow">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <span>Run</span>
                    </button>
                </div>
                <button onclick="openInBlank()" title="Open code in about:blank" aria-label="Open code in a new tab" class="text-slate-400 hover:text-white px-2 py-1 rounded-lg transition">Open in new tab ↗</button>
            </div>

            <!-- Output Preview Frame -->
            <iframe id="previewFrame" class="flex-1 w-full h-full border-0 bg-white" sandbox="allow-scripts allow-modals allow-forms allow-same-origin"></iframe>
        </div>

    </div>

    <script>
        let cmHtml, cmCss, cmJs;
        let selectedColor = localStorage.getItem('lex_accent') || '#3b82f6';

        function loadEditorValue(key, fallback) {
            const temporaryValue = sessionStorage.getItem(key);
            if (temporaryValue !== null) return temporaryValue;

            const savedValue = localStorage.getItem(key);
            if (savedValue === null) return fallback;

            sessionStorage.setItem(key, savedValue);
            localStorage.removeItem(key);
            return savedValue;
        }

        const initialCode = {
            html: `<div class="card">\n  <h1>Hello from Lex</h1>\n  <p>Write standard HTML, CSS, and JS. External APIs and CDNs can be included directly in code.</p>\n  <button id="btn">Click Me</button>\n</div>`,
            css: `body {\n  margin: 0;\n  padding: 2rem;\n  font-family: system-ui, sans-serif;\n  background: #0f172a;\n  color: #f8fafc;\n  display: flex;\n  justify-content: center;\n}\n.card {\n  background: #1e293b;\n  padding: 2rem;\n  border-radius: 12px;\n  max-width: 400px;\n}\nbutton {\n  margin-top: 1rem;\n  padding: 0.5rem 1rem;\n  background: #3b82f6;\n  color: white;\n  border: none;\n  border-radius: 6px;\n  cursor: pointer;\n}`,
            js: `document.getElementById('btn').addEventListener('click', () => {\n  console.log('Button clicked!');\n});`
        };

        const serviceWorkerShim = `<script>
            if (navigator.serviceWorker) {
                try {
                    Object.defineProperty(navigator.serviceWorker, 'register', {
                        configurable: true,
                        value: () => Promise.resolve({})
                    });
                } catch (error) {}
            }
        <\/script>`;

        window.onload = function() {
            setAccentColor(selectedColor);

            cmHtml = CodeMirror.fromTextArea(document.getElementById('editorHtml'), { mode: 'htmlmixed', theme: 'dracula', lineNumbers: true, autoCloseBrackets: true, tabSize: 2 });
            cmCss = CodeMirror.fromTextArea(document.getElementById('editorCss'), { mode: 'css', theme: 'dracula', lineNumbers: true, autoCloseBrackets: true, tabSize: 2 });
            cmJs = CodeMirror.fromTextArea(document.getElementById('editorJs'), { mode: 'javascript', theme: 'dracula', lineNumbers: true, autoCloseBrackets: true, tabSize: 2 });

            cmHtml.setValue(loadEditorValue('lex_html', initialCode.html));
            cmCss.setValue(loadEditorValue('lex_css', initialCode.css));
            cmJs.setValue(loadEditorValue('lex_js', initialCode.js));

            switchTab('html');

            if (!localStorage.getItem('lex_onboarded')) {
                openOnboarding();
            } else {
                closeOnboarding();
            }

            runCode();
        };

        function selectAccent(hex) {
            selectedColor = hex;
            setAccentColor(hex);
            document.querySelectorAll('.color-opt').forEach(el => {
                if (el.dataset.color === hex) {
                    el.classList.add('ring-2', 'ring-white', 'scale-110');
                } else {
                    el.classList.remove('ring-2', 'ring-white', 'scale-110');
                }
            });
        }

        function setAccentColor(hex) {
            document.documentElement.style.setProperty('--accent-color', hex);
            document.documentElement.style.setProperty('--accent-glow', hex + '40');
            document.documentElement.style.setProperty('--accent-border', hex + '66');
            localStorage.setItem('lex_accent', hex);
        }

        function openOnboarding() {
            selectAccent(selectedColor);
            document.getElementById('onboardingModal').classList.remove('hidden');
        }

        function completeOnboarding() {
            localStorage.setItem('lex_onboarded', 'true');
            closeOnboarding();
        }

        function closeOnboarding() {
            document.getElementById('onboardingModal').classList.add('hidden');
        }

        function switchTab(tab) {
            ['html', 'css', 'js'].forEach(t => {
                const wrapId = 'editor' + t.charAt(0).toUpperCase() + t.slice(1) + 'Wrap';
                const tabId = 'tab' + t.charAt(0).toUpperCase() + t.slice(1);
                
                const wrapEl = document.getElementById(wrapId);
                const tabEl = document.getElementById(tabId);

                if (wrapEl) wrapEl.classList.add('hidden');
                if (tabEl) tabEl.className = 'px-3 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition';
            });

            const activeWrapId = 'editor' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Wrap';
            const activeTabId = 'tab' + tab.charAt(0).toUpperCase() + tab.slice(1);

            const activeWrap = document.getElementById(activeWrapId);
            const activeTab = document.getElementById(activeTabId);

            if (activeWrap) activeWrap.classList.remove('hidden');
            if (activeTab) activeTab.className = 'px-3 py-1 rounded-md text-xs font-medium bg-slate-800 text-white accent-border border-b-2 transition';

            setTimeout(() => {
                if (tab === 'html' && cmHtml) cmHtml.refresh();
                if (tab === 'css' && cmCss) cmCss.refresh();
                if (tab === 'js' && cmJs) cmJs.refresh();
            }, 10);
        }

        function runCode() {
            const html = cmHtml.getValue();
            const css = cmCss.getValue();
            const js = cmJs.getValue();

            sessionStorage.setItem('lex_html', html);
            sessionStorage.setItem('lex_css', css);
            sessionStorage.setItem('lex_js', js);

            const doc = `<!DOCTYPE html><html><head><style>${css}</style>${serviceWorkerShim}</head><body>${html}<script>${js}<\/script></body></html>`;
            
            document.getElementById('previewFrame').srcdoc = doc;
        }

        function openInBlank() {
            const outputWindow = window.open('about:blank', '_blank');
            if (!outputWindow) return;

            outputWindow.opener = null;
            const html = cmHtml.getValue();
            const css = cmCss.getValue();
            const js = cmJs.getValue();
            const doc = `<!DOCTYPE html><html><head><style>${css}</style>${serviceWorkerShim}</head><body>${html}<script>${js}<\/script></body></html>`;

            outputWindow.document.open();
            outputWindow.document.write(doc);
            outputWindow.document.close();
        }

    </script>
</body>
</html>
